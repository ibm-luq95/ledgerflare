[project]
name = "ledgerflare"
version = "1.0.0"
description = "LedgerFlare — Financial SaaS management and accounting platform."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
  "apscheduler",
  "beautifulsoup4>=4.15.0",
  "click",
  "colorama",
  "crispy-tailwind",
  "cryptography",
  "Django~=6.0",
  "django-admin-rangefilter",
  "django-auditlog",
  "django-axes>=6.0.0",
  "django-components",
  "django-cors-headers",
  "django-crispy-forms",
  "django-csp>=4.0.0",
  "django-extensions",
  "django-filter",
  "django-guardian",
  "django-import-export",
  "django-log-viewer",
  "django-maintenance-mode",
  "django-session-timeout",
  "django-valkey",
  "django-vite-boilerplate",
  "django-widget-tweaks",
  "djangorestframework",
  "drf-spectacular",
  "drf-standardized-errors",
  "gunicorn",
  "inflection",
  "nh3>=0.3.6",
  "numpy",
  "openpyxl>=3.1.5",
  "pandas",
  "Pillow",
  "prettyprinter",
  "prettytable",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
  "python-dateutil",
  "python-json-logger",
  "python-magic",
  "PyYAML",
  "requests",
  "rich",
  "sentry-sdk[django]",
  "termcolor",
  "valkey",
  "whitenoise",
]

[dependency-groups]
dev = [
  "bpython",
  "colorlog",
  "coverage>=7.15.2",
  "django-admin-cli",
  "django-coverage-plugin>=3.2.2",
  "django-debug-toolbar",
  "django-debugtools>=2.0",
  "django-model-info",
  "ipython",
  "playwright>=1.62.0",
  "Werkzeug",
]

testing = [
  "factory-boy",
  "faker",
  "model-bakery",
  "pytest",
  "pytest-cov",
  "pytest-django",
]

lint = [
  "bandit",
  "djlint",
  "ruff",
]

types = [
  "django-stubs",
  "django-stubs-ext",
  "djangorestframework-stubs[compatible-mypy]",
  "mypy",
  "mypy-extensions",
  "types-requests",
]

docs = [
  "autotyping",
  "infer-types",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "MonkeyType",
  "sphinx",
]

[tool.uv]
package = false
default-groups = ["dev", "testing", "lint", "types"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "beach_wood_financial_proj.settings.test"
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
testpaths = ["src"]
addopts = "-p no:warnings --ignore=src/core/views/test_logging.py --ignore=src/core/views/test_security_logging.py --ignore=src/core/views/test_sql_logging.py"
markers = [
  "unit: Fast unit tests (models, serializers, helpers)",
  "integration: Integration & view tests",
  "security: Encryption, audit logging, middleware tests",
  "guardian: Object-level permission tests",
  "workflow: Multi-app end-to-end integration workflows",
  "slow: Long running tests (deselect with '-m \"not slow\"')",
  "e2e: End-to-end browser tests",
]

[tool.django-stubs]
django_settings_module = "beach_wood_financial_proj.settings.test"

[tool.isort]
py_version = 314
profile = "django"
line_length = 88
force_single_line = false
use_parentheses = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = [
  "beach_wood_financial_proj",
  "beach_wood_user",
  "bw_ui_components",
  "client",
  "client_account",
  "client_accounting",
  "client_category",
  "components",
  "core",
  "dashboard",
  "discussion",
  "document",
  "document_template",
  "fiscal_year",
  "home",
  "important_contact",
  "job",
  "job_category",
  "job_template",
  "lf_notifications",
  "manager",
  "note",
  "note_template",
  "reports",
  "site_settings",
  "special_assignment",
  "special_assignment_template",
  "staff_briefcase",
  "task",
  "task_item",
  "task_template",
]
known_third_party = [
  "django",
  "rest_framework",
  "numpy",
  "pandas",
]

[tool.djlint]
profile = "django"
extension = "html,djhtml"
indent = 4
exclude = ".venv,venv,.tox,build,dist,node_modules,src/staticfiles,src/static/build,media,**/*.py,**/__pycache__,**/migrations/**"
blank_line_after_tag = "load,extends,include"
blank_line_before_tag = "load,extends,include"
max_line_length = 95
format_attribute_template_tags = true
format_js = true
format_css = true
ignore = "H006, H014"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
strict_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = false
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
disallow_subclassing_any = true
exclude = ["docs", "test", "tests"]

[tool.bandit]
targets = ["src"]
skips = ["B101"]

[tool.docformatter]
wrap-summaries = 82
wrap-descriptions = 81
blank = true
pre-summary-newline = true
pre-summary-space = true
make-summary-multi-line = true

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/migrations/*",
  "src/beach_wood_financial_proj/settings/*",
  "src/beach_wood_financial_proj/wsgi.py",
  "src/beach_wood_financial_proj/asgi.py",
  "src/manage.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
